name: publish-ghcr

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  self-hosted-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate isolated local secrets
        run: python scripts/init_local_env.py --privacy-policy strict

      - name: Build and start self-hosted stack
        run: docker compose up --detach --build --wait

      - name: Prove self-hosted privacy and governance path
        run: python scripts/self_hosted_smoke.py --verify-restart

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop self-hosted stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    needs: self-hosted-proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ingestion
            dockerfile: services/ingestion_api_service/Dockerfile
          - image: processor
            dockerfile: services/document_processor_service/Dockerfile
          - image: rag
            dockerfile: services/rag_query_service/Dockerfile
          - image: dashboard
            dockerfile: services/dashboard_service/Dockerfile
          - image: privacy
            dockerfile: services/privacy_service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve lowercase owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/alchimista-${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
