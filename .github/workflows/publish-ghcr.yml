name: publish-ghcr

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  self-hosted-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate isolated local secrets
        run: python scripts/init_local_env.py --privacy-policy protect_egress

      - name: Build and start self-hosted stack
        run: docker compose up --detach --build --wait

      - name: Prove self-hosted privacy and governance path
        run: python scripts/self_hosted_smoke.py --verify-restart

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop self-hosted stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    needs: self-hosted-proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ingestion
            dockerfile: services/ingestion_api_service/Dockerfile
          - image: processor
            dockerfile: services/document_processor_service/Dockerfile
          - image: rag
            dockerfile: services/rag_query_service/Dockerfile
          - image: dashboard
            dockerfile: services/dashboard_service/Dockerfile
          - image: privacy
            dockerfile: services/privacy_service/Dockerfile
          - image: rizzo-model
            dockerfile: services/rizzo_model_service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve lowercase owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/alchimista-${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
