name: full-rizzo-acceptance

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  full-rizzo:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-rizzo-acceptance')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate isolated local secrets
        run: python scripts/init_local_env.py --privacy-policy protect_egress

      - name: Build and start self-hosted stack
        run: docker compose up --detach --build --wait

      - name: Install, load, use, restart, and reload pinned Full Rizzo
        run: python scripts/full_rizzo_acceptance.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop self-hosted stack
        if: always()
        run: docker compose down --volumes --remove-orphans
