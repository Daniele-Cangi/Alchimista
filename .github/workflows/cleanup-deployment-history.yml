name: cleanup-deployment-history

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-deployment-history.yml

permissions:
  contents: write
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove prod and test deployment records
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const environments = ['prod', 'test'];

            for (const environment of environments) {
              const deployments = await github.paginate(
                github.rest.repos.listDeployments,
                { owner, repo, environment, per_page: 100 }
              );

              core.info(`${environment}: found ${deployments.length} deployment record(s)`);

              for (const deployment of deployments) {
                try {
                  await github.rest.repos.createDeploymentStatus({
                    owner,
                    repo,
                    deployment_id: deployment.id,
                    state: 'inactive',
                    auto_inactive: false,
                    description: 'Inactive project cleanup'
                  });
                } catch (error) {
                  core.warning(`Could not mark deployment ${deployment.id} inactive: ${error.message}`);
                }

                try {
                  await github.rest.repos.deleteDeployment({
                    owner,
                    repo,
                    deployment_id: deployment.id
                  });
                  core.info(`Deleted deployment ${deployment.id} (${environment})`);
                } catch (error) {
                  core.setFailed(`Could not delete deployment ${deployment.id} (${environment}): ${error.message}`);
                  return;
                }
              }
            }

            const marker = Buffer.from(
              `deployment cleanup completed at ${new Date().toISOString()}\n`
            ).toString('base64');

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: '.github/deployment-cleanup-complete.txt',
              message: 'chore: record deployment cleanup completion',
              content: marker,
              branch: 'main'
            });
