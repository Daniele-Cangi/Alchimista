name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/requirements-common.txt -r services/dashboard_service/requirements.txt pytest httpx

      - name: Run tests
        run: |
          python -m pytest tests -q

  spec-gate-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate benchmark gate config in spec
        run: |
          python scripts/check_benchmark_gate.py --spec spec/project.yaml --allow-missing-report

  self-hosted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate isolated local secrets
        run: python scripts/init_local_env.py --privacy-policy protect_egress

      - name: Build and start self-hosted stack
        run: docker compose up --detach --build --wait

      - name: Run self-hosted privacy and governance proof
        run: python scripts/self_hosted_smoke.py --verify-restart

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop self-hosted stack
        if: always()
        run: docker compose down --volumes --remove-orphans
