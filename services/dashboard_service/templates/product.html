<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Alchimista</title>
  <link rel="icon" href="/static/images/favicon.svg">
  <link rel="stylesheet" href="/static/css/product.css?v=alchimista-atelier-1">
</head>
<body>
  <div class="shell">
    <header class="sidebar site-header">
      <a class="brand" href="/home" aria-label="Alchimista Home">
        <img class="brand-logo" src="/static/images/logo/logo-dark.png" alt="">
        <span><strong>Alchimista</strong><small>Governance locale</small></span>
      </a>
      <nav id="nav" aria-label="Navigazione principale">
        <a href="/home" data-route="home"><span>⌂</span>Home</a>
        <a href="/documents" data-route="documents"><span>▤</span>Documenti</a>
        <a href="/ask" data-route="ask"><span>✦</span>Chiedi</a>
        <a href="/privacy" data-route="privacy"><span>◇</span>Privacy</a>
        <a href="/audit" data-route="audit"><span>◎</span>Audit</a>
        <a href="/governance" data-route="governance"><span>⚖</span>Governance</a>
        <a href="/system" data-route="system"><span>⎈</span>Sistema</a>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" id="global-status"></span>
        <span><small>Workspace</small><strong id="workspace-label">default</strong></span>
      </div>
    </header>
    <section class="workspace">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" aria-label="Apri navigazione" aria-controls="nav">☰</button>
        <div><p class="eyebrow" id="page-eyebrow">Alchimista locale</p><h1 id="page-title">Workspace</h1></div>
        <div class="top-actions"><span class="local-pill"><span>●</span> Runtime locale</span><button class="icon-button" id="refresh" aria-label="Aggiorna">↻</button></div>
      </header>
      <main id="app" tabindex="-1"><div class="loading-card"><span class="spinner"></span>Caricamento…</div></main>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="evidence-modal"><button class="modal-close" aria-label="Chiudi">×</button><div id="evidence-content"></div></dialog>
  <dialog id="document-delete-modal"><button class="modal-close" aria-label="Chiudi">×</button><div id="document-delete-content"></div></dialog>
  <script src="/static/js/product.js?v=alchimista-atelier-1" defer></script>
</body>
</html>
